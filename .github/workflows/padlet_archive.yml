name: Padletアーカイブ一括取得

on:
  schedule:
    # 毎時0分に実行
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-archives:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: フォルダ作成とデータ取得
        run: |
          # --- 設定エリア ---
          
          # 日本時間に設定
          export TZ='Asia/Tokyo'
          
          # 保存先のフォルダをまとめて作成
          mkdir -p archive/nyg archive/woolisbest archive/magurock archive/kiseikaijoiinkai

          # 待機時間を決定（無料枠節約のため短縮）
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SLEEP_TIME=1
          else
            SLEEP_TIME=2
          fi
          
          echo "現在のモード: ${{ github.event_name }}"
          echo "待機時間: ${SLEEP_TIME}秒"

          # ==========================================
          # JSON書き出し・メタデータ抽出用Pythonスクリプト
          # ==========================================
          cat << 'EOF' > parse_metadata.py
          import sys, json, re, os
          from datetime import datetime, timedelta

          file_path = sys.argv[1]
          board_key = sys.argv[2]
          fetched_time = sys.argv[3]
          info_json_path = 'info.json'

          # 既存の info.json を読み込む
          data = {}
          if os.path.exists(info_json_path):
              with open(info_json_path, 'r', encoding='utf-8') as f:
                  try:
                      data = json.load(f)
                  except:
                      pass

          # ダウンロードしたマークダウンを読み込む
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          lines = [line.strip() for line in content.split('\n')]

          title = ""
          desc = ""
          link = ""
          builder = ""
          posts = "0"
          created = ""
          updated = ""

          # タイトル抽出 (最初の # )
          if lines and lines[0].startswith('# '):
              title = lines[0][2:]

          # 説明文抽出 (タイトルの次の空白でない行、## 要約の前まで)
          for line in lines[1:10]:
              if line == "": continue
              if line.startswith('## '): break
              desc = line
              break

          # UTCからJSTへ変換する関数（年省略・英語・日本語対応）
          def convert_time(time_str):
              if not time_str: return ""
              time_str = re.sub(r'\s+', ' ', time_str.strip())
              time_str_upper = time_str.replace('am', 'AM').replace('pm', 'PM')
              
              # 英語フォーマットの試行 (例: Aug 20, 2024 10:59pm)
              try:
                  dt = datetime.strptime(time_str_upper, "%b %d, %Y %I:%M%p")
                  dt += timedelta(hours=9)
                  return dt.strftime("%Y/%m/%d %H:%M:%S")
              except ValueError:
                  pass
                  
              # 日本語/年省略フォーマットの試行 (例: 08/20 22:59)
              try:
                  dt = datetime.strptime(time_str, "%m/%d %H:%M")
                  dt += timedelta(hours=9)
                  return dt.strftime("%m/%d %H:%M") # 年はそのまま省略
              except ValueError:
                  pass
                  
              return time_str

          # 上部20行からメタデータを検索
          for line in lines[:20]:
              m_link = re.search(r'\*\*(?:Link|リンク):\*\*\s*(.*)', line)
              if m_link: link = m_link.group(1)
              
              m_builder = re.search(r'\*\*(?:Builder|所有者):\*\*\s*(.*)', line)
              if m_builder: builder = m_builder.group(1)
              
              m_posts = re.search(r'\*\*(?:Posts|投稿):\*\*\s*(.*)', line)
              if m_posts: posts = m_posts.group(1)
              
              m_created = re.search(r'\*\*(?:Created At \(UTC\)|作成日（UTC）):\*\*\s*(.*)', line)
              if m_created: created = convert_time(m_created.group(1))
              
              m_updated = re.search(r'\*\*(?:Updated At \(UTC\)|更新日（UTC）):\*\*\s*(.*)', line)
              if m_updated: updated = convert_time(m_updated.group(1))

          # 投稿数を数値に変換
          try:
              posts = int(posts)
          except ValueError:
              pass

          # JSONに格納
          data[board_key] = {
              "title": title,
              "desc": desc,
              "link": link,
              "builder": builder,
              "posts": posts,
              "created": created,
              "updated": updated,
              "fetched": fetched_time
          }

          # 書き出し
          with open(info_json_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          EOF


          # --- 関数定義（賢い比較＋日付をつけて保存する処理） ---
          function save_padlet {
            local URL=$1
            local OUT_FILE=$2
            # OUT_FILE から "archive/" と ".md" を消してキーを作成（例: nyg/main）
            local KEY="${OUT_FILE#archive/}"
            KEY="${KEY%.md}"
            
            # 1. 一旦データを一時ファイルにダウンロード
            if curl -L --compressed -s -o temp_download.md "$URL"; then
                
                # 1.5. 空白ファイルチェック：サイズが0バイトならエラーとしてスキップ
                if [ ! -s temp_download.md ]; then
                    echo "⚠️ エラー: $OUT_FILE はデータが空白でした。更新をスキップします。"
                    rm temp_download.md
                    return 0
                fi

                # 2. 中身のチェック：先頭が "<!DOCTYPE html>" だったらスキップ
                if head -n 1 temp_download.md | grep -q "<!DOCTYPE html>"; then
                    echo "⚠️ スキップ: $OUT_FILE はエラーページ(HTML)でした。更新しません。"
                    rm temp_download.md
                    return 0
                fi

                # 3. 変更チェック（diffコマンドで比較）
                if [ -f "$OUT_FILE" ]; then
                    # 既存ファイルのヘッダー（1,2行目）を除外したものを一時作成
                    tail -n +3 "$OUT_FILE" > current_body.tmp
                    
                    # diff -q で比較（--strip-trailing-cr で改行コードの違いを無視して比較）
                    if diff -q --strip-trailing-cr temp_download.md current_body.tmp > /dev/null; then
                        echo "✅ 変更なし: $OUT_FILE (更新日時も維持します)"
                        rm temp_download.md current_body.tmp
                        return 0 # 変更がないので終了
                    fi
                    
                    rm current_body.tmp
                fi

                # 4. 変更があった（または初回）場合、保存処理を実行
                NOW=$(date "+%Y/%m/%d %H:%M:%S")
                
                # ▼▼ ここでPythonスクリプトを呼び出して info.json を更新 ▼▼
                python3 parse_metadata.py temp_download.md "$KEY" "$NOW"
                
                # ヘッダー（日時と空行）を書き込み（上書き）
                echo "最終更新: $NOW" > "$OUT_FILE"
                echo "" >> "$OUT_FILE"
                
                # ダウンロードした中身を追記
                cat temp_download.md >> "$OUT_FILE"
                
                # 一時ファイルを削除
                rm temp_download.md
                echo "🔄 更新完了: $OUT_FILE ($NOW)"

            else
                echo "❌ エラー: ダウンロード失敗 $OUT_FILE"
            fi
            
            # 休憩
            sleep $SLEEP_TIME
          }

          # ==========================================
          # 実行エリア
          # ==========================================

          # --- 1. nyg シリーズ ---
          save_padlet "https://padlet.com/padlets/a8v7cjbbfni702kg/exports/markdown.md" "archive/nyg/main.md"
          save_padlet "https://padlet.com/padlets/scvs0iw7tdatft21/exports/markdown.md" "archive/nyg/archive.md"
          save_padlet "https://padlet.com/padlets/ybtryru0lgzpxp34/exports/markdown.md" "archive/nyg/ssjc.md"
          save_padlet "https://padlet.com/padlets/lpiw7xio9gwnmxrd/exports/markdown.md" "archive/nyg/portalworld.md"
          save_padlet "https://padlet.com/padlets/i0fd897smvjo0tvj/exports/markdown.md" "archive/nyg/arashitaisaku.md"
          save_padlet "https://padlet.com/padlets/4b9092979b4e6dlm/exports/markdown.md" "archive/nyg/games.md"
          save_padlet "https://padlet.com/padlets/hqm4zg0lw3smlc23/exports/markdown.md" "archive/nyg/ssjt2025.md"

          # --- 2. woolisbest シリーズ ---
          save_padlet "https://padlet.com/padlets/99xq7bb7zjzcfzw0/exports/markdown.md" "archive/woolisbest/lobby.md"
          save_padlet "https://padlet.com/padlets/f46agi7nbsmz8boy/exports/markdown.md" "archive/woolisbest/main.md"

          # --- 3. magurock シリーズ ---
          save_padlet "https://padlet.com/padlets/e9n4zhdx6ucfbaa4/exports/markdown.md" "archive/magurock/lobby.md"
          save_padlet "https://padlet.com/padlets/v7eblregk0t2eq0k/exports/markdown.md" "archive/magurock/main.md"

          # --- 4. kiseikaijoiinkai シリーズ ---
          save_padlet "https://padlet.com/padlets/5db70e80bto7rnxl/exports/markdown.md" "archive/kiseikaijoiinkai/lobby.md"
          save_padlet "https://padlet.com/padlets/g07iihoi22rh2q7l/exports/markdown.md" "archive/kiseikaijoiinkai/main.md"

          # --- 5. その他の単独ファイル ---
          save_padlet "https://padlet.com/padlets/zsdegt1d6scuq9qa/exports/markdown.md" "archive/beruri.md"
          save_padlet "https://padlet.com/padlets/fj7pwrjfd44519fq/exports/markdown.md" "archive/bonjour.md"
          save_padlet "https://padlet.com/padlets/afg5jcs1w4yyk2h1/exports/markdown.md" "archive/hikari.md"
          save_padlet "https://padlet.com/padlets/kulz2hpe9vtrxep4/exports/markdown.md" "archive/itrsa.md"
          save_padlet "https://padlet.com/padlets/34b6kq9lghbe3rtm/exports/markdown.md" "archive/kabotya.md"
          save_padlet "https://padlet.com/padlets/5ggicyna1yjvquxr/exports/markdown.md" "archive/obungu.md"
          save_padlet "https://padlet.com/padlets/n0g1c0jl2ak3grc5/exports/markdown.md" "archive/sennin.md"
          save_padlet "https://padlet.com/padlets/236elh6xnvi2nw9q/exports/markdown.md" "archive/romanpearce.md"
          save_padlet "https://padlet.com/padlets/okjy1jmzjzdbb5jm/exports/markdown.md" "archive/ouga.md"

      - name: まとめて保存
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          
          # archiveフォルダと info.json を追加
          git add archive/ info.json
          
          if git diff --staged --quiet; then
            echo "変更がなかったので保存しません"
          else
            git commit -m "アーカイブデータとメタデータを一括更新"
            git pull origin main --rebase
            git push
          fi
