<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リダイレクトしています...</title>

    <meta id="redirect-meta" http-equiv="refresh" content="0; url=/view">
    <script>
        // 1. HTMLのmetaタグからリダイレクト先URLを取得（1箇所管理を実現）
        var content = document.getElementById('redirect-meta').getAttribute('content');
        var targetUrl = content.substring(content.indexOf('url=') + 4).replace(/^['"]|['"]$/g, '');

        // 2. JSによるリダイレクト（ブラウザの「戻る」ボタンを押した際の無限ループを防止）
        if (targetUrl) {
            window.location.replace(targetUrl);
        }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            color: #333;
            background-color: #f6f8fa; /* GitHub風の背景色 */
        }
        a { color: #0969da; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <p>自動的にページが移動します。少々お待ちください...</p>
    
    <script>
        // 3. ブラウザのセキュリティ設定等で自動移動がブロックされた場合の救済リンク
        document.write('<p>自動的に移動しない場合は、<a href="' + targetUrl + '">こちらのリンク</a>をクリックしてください。</p>');
    </script>
    
    <noscript>
        <p>※JavaScriptが無効な環境でも、数秒後に自動的に移動します。</p>
    </noscript>
</body>
</html>
