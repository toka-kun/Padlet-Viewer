<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    
    <style>
        /* --- 全体レイアウト --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ヘッダー --- */
        header {
            padding: 0 24px;
            height: 60px;
            background-color: #010409;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        header h1 { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: #e6edf3; 
            display: flex; align-items: center; gap: 8px; margin: 0;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            max-width: 60%; 
        }
        header h1::before { content: '📋'; font-size: 1.2rem; flex-shrink: 0; }
        
        /* メタ情報（投稿数・更新日）エリア */
        header .meta-info { 
            font-size: 0.85rem; color: #8b949e; 
            font-family: ui-monospace, SFMono-Regular, monospace; 
            white-space: nowrap; margin-left: auto;
            display: flex; gap: 16px; align-items: center;
        }
        header .meta-info span {
            display: flex; align-items: center; gap: 6px;
        }

        /* --- メインボードエリア --- */
        #board-canvas {
            flex-grow: 1;
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            padding: 24px;
            gap: 24px;
            align-items: flex-start;
        }

        /* --- カラム（列） --- */
        .column {
            background-color: #161b22;
            min-width: 350px;
            max-width: 350px;
            border-radius: 6px;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            max-height: 100%;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .column-header {
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            border-bottom: 1px solid #21262d;
            color: #e6edf3;
            background-color: #161b22;
            border-radius: 6px 6px 0 0;
            flex-shrink: 0;
            position: sticky; top: 0; z-index: 10;
        }

        .column-body {
            padding: 12px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #30363d #161b22;
        }
        .column-body::-webkit-scrollbar { width: 8px; }
        .column-body::-webkit-scrollbar-track { background: #161b22; }
        .column-body::-webkit-scrollbar-thumb { background-color: #30363d; border-radius: 4px; }

        /* --- カード --- */
        .card {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 16px;
            display: flex; flex-direction: column;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: all 0.2s cubic-bezier(0.3, 0, 0.5, 1);
        }
        .card:hover {
            border-color: #8b949e;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            z-index: 5;
        }

        /* 色設定 */
        .card.color-white  { border-left: 3px solid #8b949e; }
        .card.color-red    { border-left: 3px solid #ff7b72; background: linear-gradient(180deg, rgba(255,123,114,0.1) 0%, rgba(13,17,23,0) 50%); }
        .card.color-yellow { border-left: 3px solid #d29922; background: linear-gradient(180deg, rgba(210,153,34,0.1) 0%, rgba(13,17,23,0) 50%); }
        .card.color-green  { border-left: 3px solid #3fb950; background: linear-gradient(180deg, rgba(63,185,80,0.1) 0%, rgba(13,17,23,0) 50%); }
        .card.color-blue   { border-left: 3px solid #58a6ff; background: linear-gradient(180deg, rgba(88,166,255,0.1) 0%, rgba(13,17,23,0) 50%); }
        .card.color-purple { border-left: 3px solid #bc8cff; background: linear-gradient(180deg, rgba(188,140,255,0.1) 0%, rgba(13,17,23,0) 50%); }

        /* タイトル・ヘッダー（作成者・日付） */
        .card-title {
            font-size: 1rem; font-weight: 600; margin-bottom: 4px;
            color: #e6edf3; line-height: 1.4;
        }
        .card-meta-header {
            font-size: 0.75rem; color: #7d8590; margin-bottom: 12px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        }
        
        /* 作成者表示スタイル（通常・リンク） */
        .card-meta-header .author, 
        .card-meta-header .author-link { 
            display: flex; align-items: center; gap: 4px; 
            color: #e6edf3; font-weight: 500; 
        }
        .author-link {
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .author-link:hover {
            color: #58a6ff; 
            text-decoration: underline;
        }

        .card-meta-header .date { color: #8b949e; }

        /* 添付ファイル・リンクエリア */
        .attachment-area {
            margin-bottom: 12px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .attachment-area img.attached-image {
            max-width: 100%; height: auto;
            border-radius: 4px; border: 1px solid #30363d;
            display: block;
        }

        /* 共通ボタンスタイル */
        .action-link {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 12px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #58a6ff !important;
            font-size: 0.8rem;
            text-decoration: none !important;
            transition: background 0.2s;
            font-weight: 600;
            width: fit-content;
        }
        .action-link:hover {
            background-color: #30363d;
            color: #79c0ff !important;
            border-color: #8b949e;
        }

        /* 添付ファイル（画像以外）用のFaviconリンクスタイル */
        .favicon-link {
            display: inline-flex; align-items: center; gap: 10px;
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 6px;
            color: #c9d1d9;
            text-decoration: none;
            transition: all 0.2s;
            max-width: 100%;
            box-sizing: border-box;
            overflow: hidden;
        }
        .favicon-link:hover {
            background-color: #21262d;
            border-color: #8b949e;
        }
        .favicon-link img {
            width: 24px !important; 
            height: 24px !important; 
            border-radius: 4px;
            margin: 0 !important;
            border: none !important;
            flex-shrink: 0;
        }
        .favicon-link span {
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            font-size: 0.85rem;
        }

        /* 本文 */
        .card-content {
            font-size: 0.85rem; line-height: 1.6; color: #c9d1d9;
            margin-bottom: 12px; overflow-wrap: break-word;
        }
        .card-content img { 
            max-width: 100%; height: auto; 
            border-radius: 4px; border: 1px solid #30363d; 
            margin-top: 8px; margin-bottom: 6px; display: block;
        }
        .card-content a { color: #58a6ff; text-decoration: none; }
        .card-content a:hover { text-decoration: underline; }

        /* カスタムフィールド表示エリア */
        .custom-fields-area {
            background-color: rgba(110, 118, 129, 0.1);
            border-radius: 4px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: #c9d1d9;
            border: 1px solid rgba(48, 54, 61, 0.5);
        }
        .custom-field-row {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 8px;
            align-items: start;
            margin-bottom: 6px;
            line-height: 1.5;
        }
        .custom-field-row:last-child { margin-bottom: 0; }
        .custom-field-label {
            color: #8b949e;
            font-weight: 600;
            word-break: break-word;
        }
        .custom-field-value {
            color: #c9d1d9;
            word-break: break-word;
        }

        /* リアクション（スター＋絵文字）エリア */
        .reactions-section {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 6px;
            padding: 8px 0;
            border-top: 1px solid rgba(48, 54, 61, 0.5);
            margin-top: auto;
        }
        .stars {
            background: rgba(227, 179, 65, 0.1); color: #e3b341;
            padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 600;
        }
        .stars-count { color: #8b949e; font-weight: normal; font-size: 0.75rem; margin-left: 4px; }

        /* 絵文字リアクション */
        .emoji-reactions {
            display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
        }
        .emoji-reaction {
            display: inline-flex; align-items: center; gap: 3px;
            background: rgba(110, 118, 129, 0.1);
            border: 1px solid rgba(48, 54, 61, 0.5);
            padding: 2px 7px; border-radius: 10px;
            font-size: 0.85rem;
        }
        .emoji-reaction .emoji-count {
            color: #8b949e; font-size: 0.75rem; font-weight: 600;
        }

        /* コメントエリア（一番下） */
        .comments-section {
            background-color: #161b22;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 8px;
            border: 1px solid #30363d;
        }
        .comments-header {
            font-size: 0.75rem; font-weight: 600; color: #7d8590;
            margin-bottom: 8px; display: flex; justify-content: space-between;
        }
        .comments-list {
            max-height: 150px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
            scrollbar-width: thin;
        }
        .comment-item {
            font-size: 0.8rem; padding: 8px 0; border-bottom: 1px solid #21262d;
        }
        .comment-item:last-child { border-bottom: none; }
        .comment-top { display: flex; justify-content: space-between; margin-bottom: 2px; font-size: 0.75rem; }
        .comment-user { color: #e6edf3; font-weight: bold; }
        .comment-date { color: #7d8590; }
        .comment-msg { color: #c9d1d9; word-break: break-all; }

        /* ロード・エラー */
        #loading { width: 100%; height: 100%; display: flex; padding: 20px; gap: 20px; }
        .skeleton-column {
            min-width: 350px; height: 80%; background: #161b22;
            border-radius: 6px; border: 1px solid #30363d; padding: 15px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .skeleton-card {
            width: 100%; height: 120px; background: #21262d;
            border-radius: 6px; position: relative; overflow: hidden;
        }
        .skeleton-card::after {
            content: ""; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        #error-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ff7b72; text-align: center; display: none;
        }

        /* スマホ対応 */
        @media (max-width: 768px) {
            .column { min-width: 85vw; scroll-snap-align: center; }
            #board-canvas { scroll-snap-type: x mandatory; padding: 16px; gap: 16px; }
            header { flex-wrap: wrap; height: auto; padding: 10px 16px; gap: 8px; }
            header h1 { font-size: 0.9rem; max-width: 100%; width: 100%; }
            header .meta-info { margin-left: 0; width: 100%; justify-content: flex-start; font-size: 0.75rem; }
            .custom-field-row { grid-template-columns: 92px 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>
            <span id="board-title">読み込み中...</span>
            <img src="https://count.getloli.com/@toka_kun_?name=toka_kun_&theme=original-new&padding=7&offset=0&align=top&scale=0.4&pixelated=1&darkmode=auto" alt="count" style="margin-left:8px; vertical-align:middle;">
        </h1>
        <div class="meta-info" id="meta-info">
            <span>読み込み中...</span>
        </div>
    </header>

    <main id="board-canvas">
        <div id="loading">
            <div class="skeleton-column">
                <div class="skeleton-card" style="height:40px; margin-bottom:10px;"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
            <div class="skeleton-column">
                <div class="skeleton-card" style="height:40px; margin-bottom:10px;"></div>
                <div class="skeleton-card"></div>
            </div>
        </div>
        <div id="error-message"></div>
    </main>

    <script>
        const match = window.location.href.match(/[?&]board=([^&#]+)/);
        const boardParam = match ? decodeURIComponent(match[1]) : 'nyg/main';
        const markdownUrl = `/archive/${boardParam}.md`;

        const renderer = new marked.Renderer();
        renderer.link = function(href, title, text) {
            return `<a href="${href}" target="_blank" rel="noopener noreferrer">${text}</a>`;
        };
        marked.setOptions({ renderer: renderer, breaks: true });

        DOMPurify.addHook('afterSanitizeAttributes', function (node) {
            if ('target' in node) {
                node.setAttribute('target', '_blank');
                node.setAttribute('rel', 'noopener noreferrer');
            }
        });

        async function fetchAndRender() {
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error-message');
            const metaInfoDiv = document.getElementById('meta-info');
            const canvas = document.getElementById('board-canvas');

            try {
                const response = await fetch(`${markdownUrl}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const fullText = await response.text();
                
                const headerChunk = fullText.substring(0, 4000); 
                const postsMatch = headerChunk.match(/(?:- )?\*\*(?:Posts|投稿):\*\* (\d+)/i);
                const postCount = postsMatch ? postsMatch[1] : '-';

                const splitIndex = fullText.indexOf('\n\n');
                let updateTimeStr = '最終更新: 不明';
                let markdownContent = fullText;

                if (splitIndex !== -1) {
                    updateTimeStr = fullText.substring(0, splitIndex).trim();
                    markdownContent = fullText.substring(splitIndex + 2);
                } else {
                    const firstLineBreak = fullText.indexOf('\n');
                    if (firstLineBreak !== -1) {
                         updateTimeStr = fullText.substring(0, firstLineBreak).trim();
                         markdownContent = fullText.substring(firstLineBreak + 1).trim();
                    }
                }
                
                loadingDiv.remove();
                
                metaInfoDiv.innerHTML = `
                    <span>📊 投稿数: ${postCount}</span>
                    <span>${escapeHtml(updateTimeStr)}</span>
                `;

                renderBoard(markdownContent, canvas);

            } catch (error) {
                console.error('Fetch error:', error);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <h3>読み込みに失敗しました</h3><p>${escapeHtml(error.message)}</p>
                    <button onclick="location.reload()" style="margin-top:10px; padding:6px 12px; cursor:pointer; background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px;">再読み込み</button>
                `;
                metaInfoDiv.textContent = 'エラー';
            }
        }

        function renderBoard(markdownText, canvas) {
            const titleMatch = markdownText.match(/^# (.*)/);
            if (titleMatch) {
                const boardTitle = titleMatch[1].trim();
                const titleEl = document.getElementById('board-title');
                if (titleEl) titleEl.textContent = boardTitle;
            } else {
                document.getElementById('board-title').textContent = "Padlet Viewer";
            }

            const columns = markdownText.split(/^## /gm);
            
            columns.forEach((colText, index) => {
                if (colText.trim().length === 0) return;

                if (index <= 1) return;

                const firstLineBreak = colText.indexOf('\n');
                let colTitle = (firstLineBreak === -1) ? colText.trim() : colText.substring(0, firstLineBreak).trim();
                let colContent = (firstLineBreak === -1) ? '' : colText.substring(firstLineBreak + 1);

                const colDiv = document.createElement('div');
                colDiv.className = 'column';
                colDiv.innerHTML = `
                    <div class="column-header">${escapeHtml(colTitle)}</div>
                    <div class="column-body"></div>
                `;
                const colBody = colDiv.querySelector('.column-body');

                let cardsData = colContent.split(/^### /gm);

                if (cardsData.length === 1 && !colContent.includes('### ')) {
                    const content = cardsData[0].trim();
                    if (content) {
                        cardsData = [`${colTitle} 概要\n${content}`];
                    } else {
                        cardsData = [];
                    }
                }

                cardsData.forEach((cardText, cIndex) => {
                    if (!cardText.trim()) return;

                    try {
                        const card = parseCard(cardText);
                        colBody.appendChild(createCardElement(card));
                    } catch (e) {
                        console.warn('Card parse error:', e);
                    }
                });

                if (colBody.children.length > 0) {
                    canvas.appendChild(colDiv);
                }
            });
        }

        function smartDateFormat(rawStr) {
            if (!rawStr) return null;
            
            const yearMatch = rawStr.match(/\d{4}/);
            if (!yearMatch) return rawStr;

            const enRegex = /([a-zA-Z]+)\s+(\d{1,2}),\s+(\d{4})(?:\s+(\d{1,2}):(\d{2})([ap]m))?/i;
            const enMatch = rawStr.match(enRegex);

            if (enMatch) {
                const monthStr = enMatch[1];
                const day = parseInt(enMatch[2], 10);
                const year = parseInt(enMatch[3], 10);
                let hour = enMatch[4] ? parseInt(enMatch[4], 10) : 0;
                const minute = enMatch[5] ? parseInt(enMatch[5], 10) : 0;
                const ampm = enMatch[6] ? enMatch[6].toLowerCase() : null;

                const months = {
                    jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3, may:4, 
                    jun:5, june:5, jul:6, july:6, aug:7, august:7, sep:8, september:8, oct:9, october:9, 
                    nov:10, november:10, dec:11, december:11
                };
                const month = months[monthStr.toLowerCase()];

                if (month !== undefined) {
                    if (ampm === 'pm' && hour < 12) hour += 12;
                    if (ampm === 'am' && hour === 12) hour = 0;

                    const utcDate = new Date(Date.UTC(year, month, day, hour, minute));
                    
                    if (!enMatch[4]) {
                         return utcDate.toLocaleDateString('ja-JP', {
                            year: 'numeric', month: '2-digit', day: '2-digit'
                        });
                    }
                    
                    return utcDate.toLocaleString('ja-JP', {
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour: '2-digit', minute: '2-digit'
                    });
                }
            }

            const ts = Date.parse(rawStr);
            if (!isNaN(ts)) {
                const d = new Date(ts);
                if (d.getHours() === 0 && d.getMinutes() === 0) {
                    return d.toLocaleDateString('ja-JP', {
                        year: 'numeric', month: '2-digit', day: '2-digit'
                    });
                }
                return d.toLocaleString('ja-JP', { 
                    year: 'numeric', month: '2-digit', day: '2-digit', 
                    hour: '2-digit', minute: '2-digit' 
                });
            }

            return rawStr;
        }

        function parseCard(text) {
            const lines = text.trim().split('\n');
            const title = lines[0].trim(); 
            
            const getMeta = (regex) => {
                const match = text.match(regex);
                return match ? match[1].trim() : null;
            };

            // --- 作成者 ---
            let authorRaw = getMeta(/(?:- )?\*\*(?:Author|作成者|Builder):\*\* (.*)/i) || '不明';
            let authorName = authorRaw;
            let authorUrl = null;

            const authorMatch = authorRaw.match(/^(.*)\s\((.*)\)$/);
            if (authorMatch) {
                authorName = authorMatch[1].trim(); 
                const username = authorMatch[2].trim(); 
                authorUrl = `https://padlet.com/${username}`;
            }

            // --- システムフィールド（Additional Information 等） ---
            const color = getMeta(/(?:- )?\*\*(?:Post color|Color|投稿のカラー):\*\* (.*)/i) || 'White';
            const linkUrl = getMeta(/(?:- )?\*\*(?:Link|リンク):\*\* (.*)/i);
            let rawCreatedDate = getMeta(/(?:- )?\*\*(?:Created At(?: \(UTC\))?|Date Created|Creation Date|作成日[^:*]*):\*\* (.*)/i);
            const displayCreatedDate = smartDateFormat(rawCreatedDate);

            // --- コメント ---
            let comments = [];
            const commentBlockRegex = /#### (?:Comments|コメント)[^\n]*\n([\s\S]*?)(?=####|$)/i;
            const commentMatch = text.match(commentBlockRegex);
            if (commentMatch) {
                const commentLines = commentMatch[1].trim().split('\n');
                commentLines.forEach(line => {
                    const m = line.match(/- \*\*(.*?)\*\* \((.*?)\): (.*)/);
                    if (m) {
                        const formattedDate = smartDateFormat(m[2]);
                        comments.push({ user: m[1], date: formattedDate, msg: m[3] });
                    }
                });
            }

            // --- 絵文字リアクション（新形式: - **Emojis:** 👍 (3) 👎 (1)） ---
            let reactions = [];
            const reactionBlockRegex = /#### (?:Reactions|リアクション)[^\n]*\n([\s\S]*?)(?=####|$)/i;
            const reactionBlockMatch = text.match(reactionBlockRegex);
            if (reactionBlockMatch) {
                const reactionContent = reactionBlockMatch[1].trim();
                // "- **Emojis:** 👍 (3) 👎 (1)" 形式
                const emojisLineMatch = reactionContent.match(/\*\*(?:Emojis?|絵文字):\*\*\s*(.*)/i);
                if (emojisLineMatch) {
                    const emojisStr = emojisLineMatch[1];
                    // 全絵文字対応: (N) パターンを区切りとして分割し、前の部分を絵文字として扱う
                    // ZWJ連結絵文字・バリエーションセレクタ付き絵文字・旗絵文字など全Unicodeシーケンスに対応
                    const emojiCounts = [...emojisStr.matchAll(/\((\d+)\)/g)].map(m => parseInt(m[1]));
                    const emojiParts = emojisStr.split(/\s*\(\d+\)\s*/);
                    emojiParts.forEach((part, i) => {
                        if (i < emojiCounts.length) {
                            const emoji = part.trim();
                            if (emoji) reactions.push({ emoji, count: emojiCounts[i] });
                        }
                    });
                }
            }

            // --- 星評価を先に抽出（本文中のどこにあっても拾う） ---
            const starRatingMatch = text.match(/(?:^|\n)(?:- )?\*\*(?:この投稿は役に立ちましたか？|星評価|Average star rating|星評価平均):\*\*\s*([\d.]+)\s*\/\s*5\s*[⭐★](?:\s*\((\d+)\))?/i);
            let starRating = null;
            if (starRatingMatch) {
                starRating = {
                    rating: parseFloat(starRatingMatch[1]),
                    count: starRatingMatch[2] ? parseInt(starRatingMatch[2]) : 0,
                    label: starRatingMatch[0].match(/\*\*(.*?)\*\*/)?.[1] || null
                };
            }

            // --- カスタムフィールドを汎用パース（投票とシステム項目を除外） ---
            const additionalInfoMatch = text.match(/#### Additional Information[^\n]*\n([\s\S]*?)(?=\n---|\n### |\n## |$)/i);
            const bodyBeforeSections = additionalInfoMatch ? additionalInfoMatch[1] : '';

            // 本文内のシステムフィールド（スキップ対象）
            const systemFieldRegex = /^(?:Author|作成者|Builder|Post\s+color|Color|投稿のカラー|Link|リンク|Posts|投稿数|Average\s+star\s+rating|星評価平均|Number\s+of\s+ratings|評価件数|Votes|Created\s+At|Date\s+Created|Creation\s+Date|作成日|Updated\s+At|Last\s+Updated|更新日|投票)(?:\s*\([^)]*\))?$/i;

            let customFields = [];

            // 全 **フィールド名:** 値 のペアを抽出
            const allFieldRegex = /(?:^|\n)(?:- )?\*\*([^*\n]+?):\*\*[ \t]*([^\n]+)/gm;
            let fm;
            while ((fm = allFieldRegex.exec(bodyBeforeSections)) !== null) {
                const fieldName = fm[1].trim();
                const fieldValue = fm[2].trim();

                if (systemFieldRegex.test(fieldName)) continue;

                // 通常のカスタムフィールド（日付値はフォーマット変換を試みる）
                let displayValue = fieldValue;
                const dateAttempt = smartDateFormat(fieldValue);
                if (dateAttempt && dateAttempt !== fieldValue) displayValue = dateAttempt;

                customFields.push({ label: fieldName, value: displayValue });
            }

            // 旧形式フォールバック（Average star rating / 星評価平均）
            if (!starRating) {
                const legacyRating = parseFloat(getMeta(/(?:- )?\*\*(?:Average star rating|星評価平均):\*\* ([\d\.]+)/i) || '0');
                const legacyCount = parseInt(getMeta(/(?:- )?\*\*(?:Number of ratings|評価件数):\*\* (\d+)/i) || '0');
                if (legacyRating > 0) {
                    starRating = { rating: legacyRating, count: legacyCount, label: null };
                }
            }

            // --- 本文からメタデータを削除 ---
            let content = lines.slice(1).join('\n');

            // カスタムフィールド行を動的に削除
            customFields.forEach(cf => {
                const esc = cf.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                content = content.replace(new RegExp(`(?:- )?\\*\\*${esc}:\\*\\*.*[\\r\\n]*`, 'gi'), '');
            });
            // 星評価フィールド行を削除
            if (starRating && starRating.label) {
                const esc = starRating.label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                content = content.replace(new RegExp(`(?:- )?\\*\\*${esc}:\\*\\*.*[\\r\\n]*`, 'gi'), '');
            }

            const patternsToRemove = [
                /(?:- )?\*\*(?:Author|作成者|Builder):.*[\r\n]*/gi,
                /(?:- )?\*\*(?:Post color|Color|投稿のカラー):.*[\r\n]*/gi,
                /(?:- )?\*\*(?:Created At|Date Created|Creation Date|作成日).*?:.*[\r\n]*/gi,
                /(?:- )?\*\*(?:Updated At|Last Updated|更新日).*?:.*[\r\n]*/gi,
                /(?:- )?\*\*(?:Average star rating|星評価平均):.*[\r\n]*/gi,
                /(?:- )?\*\*(?:Number of ratings|評価件数|Votes):.*[\r\n]*/gi,
                /(?:- )?\*\*(?:Link|Posts|リンク):.*[\r\n]*/gi,
                /#### (?:Comments|コメント)[\s\S]*?(?=####|$)/i, 
                /#### (?:Reactions|リアクション)[\s\S]*?(?=####|$)/i, 
                /#### (?:Additional Information|その他の情報)[\s\S]*?(?=####|$)/i, 
                /^---[\r\n]+/gm 
            ];
            patternsToRemove.forEach(regex => content = content.replace(regex, ''));
            
            // --- 添付ファイル・リンクの高度な抽出処理 ---
            let attachments = [];

            // パターン1: ![alt](url) -> 全てのMarkdown画像。拡張子が無くても!があれば画像扱い
            content = content.replace(/!\[(.*?)\]\((.*?)\)/gi, (match, alt, url) => {
                attachments.push({ url: url, isImage: true, alt: alt });
                return ''; 
            });

            // パターン2: [Attachment 1](url) や [添付ファイル 2](url) -> 画像かどうかは拡張子で判定
            content = content.replace(/\[((?:Attachment|添付ファイル)(?:\s*\d+)?)\]\((.*?)\)/gi, (match, alt, url) => {
                let isImg = /\.(jpeg|jpg|gif|png|webp|bmp|svg)(?:\?.*|#.*)?$/i.test(url);
                attachments.push({ url: url, isImage: isImg, alt: alt });
                return '';
            });

            // パターン3: [text](url) -> テキストがURLそのもの、または「https://」等が省略されたURLの場合
            content = content.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/gi, (match, linkText, url) => {
                let cleanText = linkText.trim().replace(/^https?:\/\//i, '').replace(/\/$/, '');
                let cleanUrl = url.trim().replace(/^https?:\/\//i, '').replace(/\/$/, '');
                
                if (cleanText === cleanUrl) {
                    let isImg = /\.(jpeg|jpg|gif|png|webp|bmp|svg)(?:\?.*|#.*)?$/i.test(url);
                    attachments.push({ url: url, isImage: isImg, alt: linkText });
                    return '';
                }
                return match;
            });

            return {
                title: title,
                author: authorName,   
                authorUrl: authorUrl, 
                color: color,
                content: content.trim(),
                comments: comments,
                reactions: reactions,
                starRating: starRating,
                createdDate: displayCreatedDate, 
                customFields: customFields,
                attachments: attachments,
                linkUrl: linkUrl
            };
        }

        function createCardElement(data) {
            const el = document.createElement('div');
            
            let colorClass = 'color-white';
            if (data.color) {
                const c = data.color.toLowerCase();
                if (c.includes('red') || c.includes('レッド')) colorClass = 'color-red';
                else if (c.includes('yellow') || c.includes('イエロー')) colorClass = 'color-yellow';
                else if (c.includes('green') || c.includes('グリーン')) colorClass = 'color-green';
                else if (c.includes('blue') || c.includes('ブルー')) colorClass = 'color-blue';
                else if (c.includes('purple') || c.includes('パープル')) colorClass = 'color-purple';
            }
            el.className = `card ${colorClass}`;

            // --- 星評価 ---
            let starsStr = '☆';
            let ratingText = '';
            if (data.starRating && data.starRating.rating > 0) {
                starsStr = '⭐'.repeat(Math.round(data.starRating.rating)) || '⭐';
                ratingText = data.starRating.count > 0 ? `(${data.starRating.count})` : '';
            }

            // --- 複数メディア・リンクのリッチ表示 ---
            let mediaHtml = '';
            if ((data.attachments && data.attachments.length > 0) || data.linkUrl) {
                mediaHtml += '<div class="attachment-area">';
                
                if (data.attachments) {
                    data.attachments.forEach(att => {
                        if (att.isImage) {
                            mediaHtml += `<img src="${escapeHtml(att.url)}" alt="Attachment" class="attached-image">`;
                            mediaHtml += `<a href="${escapeHtml(att.url)}" target="_blank" class="action-link">📎 画像を開く</a>`;
                        } else {
                            const encodedUrl = encodeURIComponent(att.url);
                            const faviconUrl = `https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=${encodedUrl}&size=64`;
                            
                            mediaHtml += `
                                <a href="${escapeHtml(att.url)}" target="_blank" class="favicon-link">
                                    <img src="${faviconUrl}" alt="favicon">
                                    <span>${escapeHtml(att.url)}</span>
                                </a>
                            `;
                        }
                    });
                }

                if (data.linkUrl && (!data.attachments || !data.attachments.find(a => a.url === data.linkUrl))) {
                     mediaHtml += `<a href="${escapeHtml(data.linkUrl)}" target="_blank" class="action-link">🔗 リンクを開く</a>`;
                }
                
                mediaHtml += '</div>';
            }

            // --- カスタムフィールド（全フィールドを表示） ---
            let customFieldsHtml = '';
            if (data.customFields && data.customFields.length > 0) {
                customFieldsHtml += '<div class="custom-fields-area">';
                data.customFields.forEach(cf => {
                    customFieldsHtml += `<div class="custom-field-row"><span class="custom-field-label">${escapeHtml(cf.label)}:</span><span class="custom-field-value">${escapeHtml(cf.value)}</span></div>`;
                });
                customFieldsHtml += '</div>';
            }

            // --- 絵文字リアクション ---
            let emojiReactionsHtml = '';
            if (data.reactions && data.reactions.length > 0) {
                emojiReactionsHtml = '<div class="emoji-reactions">';
                data.reactions.forEach(r => {
                    emojiReactionsHtml += `<span class="emoji-reaction">${r.emoji}<span class="emoji-count">${r.count}</span></span>`;
                });
                emojiReactionsHtml += '</div>';
            }

            let commentsHtml = '';
            if (data.comments.length > 0) {
                const list = data.comments.map(c => `
                    <div class="comment-item">
                        <div class="comment-top">
                            <span class="comment-user">${escapeHtml(c.user)}</span>
                            <span class="comment-date">${escapeHtml(c.date)}</span>
                        </div>
                        <span class="comment-msg">${escapeHtml(c.msg)}</span>
                    </div>
                `).join('');
                commentsHtml = `
                    <div class="comments-section">
                        <div class="comments-header">
                            <span>💬 コメント</span>
                            <span>${data.comments.length}</span>
                        </div>
                        <div class="comments-list">${list}</div>
                    </div>
                `;
            }

            const rawHtml = marked.parse(data.content);
            const cleanHtml = DOMPurify.sanitize(rawHtml, { ADD_ATTR: ['target', 'class'] });

            let authorHtml = '';
            if (data.authorUrl) {
                authorHtml = `<a href="${escapeHtml(data.authorUrl)}" target="_blank" class="author-link">👤 ${escapeHtml(data.author)}</a>`;
            } else {
                authorHtml = `<span class="author">👤 ${escapeHtml(data.author)}</span>`;
            }

            el.innerHTML = `
                <div class="card-title">${escapeHtml(data.title)}</div>
                
                <div class="card-meta-header">
                    ${authorHtml}
                    ${data.createdDate ? `<span class="date"> • ${escapeHtml(data.createdDate)}</span>` : ''}
                </div>

                ${mediaHtml}

                <div class="card-content markdown-body" style="background:transparent; color:#c9d1d9;">
                    ${cleanHtml}
                </div>

                ${customFieldsHtml}

                <div class="reactions-section">
                    <span class="stars">${starsStr} <span class="stars-count">${ratingText}</span></span>
                    ${emojiReactionsHtml}
                </div>

                ${commentsHtml}
            `;
            return el;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        fetchAndRender();
    </script>
    <script src="//accaii.com/padletviewer/script.js" async></script><noscript><img src="//accaii.com/padletviewer/script?guid=on"></noscript>
</body>
